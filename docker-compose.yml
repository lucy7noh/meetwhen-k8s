# 로컬 개발용 — 앱 + Postgres 를 한 번에 띄운다. (너가 배운 compose!)
#   docker compose up --build
#   → http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://meetwhen:devpass@db:5432/meetwhen
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meetwhen
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: meetwhen
    volumes:
      - pgdata:/var/lib/postgresql/data   # 볼륨 → 컨테이너 지워도 데이터 유지
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetwhen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
