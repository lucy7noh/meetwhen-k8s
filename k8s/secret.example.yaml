# 실제 비밀번호를 넣어 secret.yaml 로 복사한 뒤 적용하세요.
#   cp k8s/secret.example.yaml k8s/secret.yaml   (secret.yaml 은 .gitignore 처리됨!)
# ⚠️ 두 곳의 비밀번호(POSTGRES_PASSWORD, DATABASE_URL 안의 값)는 반드시 똑같이!
apiVersion: v1
kind: Secret
metadata:
  name: meetwhen-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_please"
  DATABASE_URL: "postgresql+psycopg2://meetwhen:CHANGE_ME_please@postgres:5432/meetwhen"
